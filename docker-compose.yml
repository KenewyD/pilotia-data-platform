services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pilotia
      POSTGRES_USER: pilotia
      POSTGRES_PASSWORD: pilotia
    ports:
      - "5432:5432"
    volumes:
      - pilotia_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  app:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - postgres

volumes:
  pilotia_pgdata:
